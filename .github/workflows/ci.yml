name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version
      - name: Run tests
        run: swift test