name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version
      - name: Run tests
        run: swift test
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme SrdzPermissions-Package \
            -destination 'generic/platform=iOS Simulator'