name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version
      - name: Run tests
        run: swift test

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme SrdzPermissions-Package \
            -destination 'generic/platform=iOS Simulator'